[project]
name = "datafordeler"
version = "1.0.1"
description = "Python bibliotek til at få adgang til datafordeleren"
readme = "README.md"
authors = [
    { name = "Michael Wulff Nielsen", email = "miwn@odense.dk" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
# README-eksemplerne har justerede kommentarer
extend-exclude = ["*.md"]
